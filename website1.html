<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Error</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

/* BACKGROUND */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at center, #ff003322, transparent 45%),
        linear-gradient(#ffffff05 1px, transparent 1px),
        linear-gradient(90deg, #ffffff05 1px, transparent 1px);
    background-size: auto, 40px 40px, 40px 40px;
}

/* SCANLINE */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 4px,
        rgba(255,255,255,.025) 5px
    );
    animation: scan 5s linear infinite;
}

@keyframes scan {
    from {
        transform: translateY(-20px);
    }

    to {
        transform: translateY(20px);
    }
}

/* CONTENT */
.container {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

.box {
    max-width: 700px;
}

/* ERROR CODE */
.code {
    font-size: clamp(90px, 22vw, 220px);
    font-weight: 900;
    line-height: .8;
    color: #ff1744;
    text-shadow:
        4px 0 #00ffff,
        -4px 0 #ff1744,
        0 0 30px #ff1744;

    animation: glitch 1.2s infinite;
}

@keyframes glitch {

    0%, 90%, 100% {
        transform: translate(0);
    }

    92% {
        transform: translate(-8px, 3px);
    }

    94% {
        transform: translate(8px, -3px);
    }

    96% {
        transform: translate(-4px, 0);
    }
}

/* TITLE */
h1 {
    margin-top: 30px;
    font-size: clamp(25px, 6vw, 50px);
    letter-spacing: 5px;
}

.message {
    margin-top: 15px;
    color: #888;
    font-size: 16px;
    line-height: 1.7;
}

/* TERMINAL */
.terminal {
    margin: 30px auto;
    padding: 15px 20px;
    max-width: 500px;
    text-align: left;
    border: 1px solid #ff1744;
    background: #080808;
    color: #ff1744;
    font-family: monospace;
    box-shadow: 0 0 20px #ff174422;
}

.cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: #ff1744;
    animation: blink .7s infinite;
}

@keyframes blink {
    50% {
        opacity: 0;
    }
}

/* BUTTON */
.btn {
    display: inline-block;
    padding: 14px 35px;
    border: 1px solid #ff1744;
    border-radius: 8px;
    background: transparent;
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: .3s;
}

.btn:hover {
    background: #ff1744;
    box-shadow: 0 0 30px #ff1744;
    transform: scale(1.05);
}

/* MOBILE */
@media (max-width: 600px) {

    .message {
        font-size: 14px;
    }

    .terminal {
        font-size: 12px;
    }

    .btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="box">

        <div class="code">404</div>

        <h1>SYSTEM ERROR</h1>

        <p class="message">
            Halaman yang kamu cari tidak ditemukan.
            <br>
            Sistem sedang mencoba memulihkan koneksi...
        </p>

        <div class="terminal">
            > system.check()<br>
            > connection: FAILED<br>
            > recovery: RUNNING <span class="cursor"></span>
        </div>

        <a href="index.html" class="btn">
            RETURN HOME
        </a>

    </div>

</div>

</body>
</html>
