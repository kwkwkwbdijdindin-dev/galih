<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Masih Proses</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    overflow-x: hidden;
    background: #050505;
}

/* BACKGROUND */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 20% 20%, #ff003c55, transparent 30%),
        radial-gradient(circle at 80% 80%, #0066ff55, transparent 30%),
        linear-gradient(135deg, #050505, #111, #020202);
    z-index: -2;
}

/* GRID */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(#ffffff08 1px, transparent 1px),
        linear-gradient(90deg, #ffffff08 1px, transparent 1px);
    background-size: 45px 45px;
    transform: perspective(500px) rotateX(55deg) scale(2);
    transform-origin: bottom;
    z-index: -1;
}

/* CONTAINER */
.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
    text-align: center;
}

/* ICON */
.icon {
    width: 90px;
    height: 90px;
    border: 3px solid #ff1744;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin-bottom: 25px;
    box-shadow:
        0 0 15px #ff1744,
        0 0 40px #ff174466;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
        box-shadow: 0 0 15px #ff1744;
    }

    50% {
        transform: scale(1.08);
        box-shadow: 0 0 40px #ff1744;
    }
}

/* TITLE */
h1 {
    font-size: clamp(42px, 9vw, 90px);
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
}

h1 span {
    color: #ff1744;
    text-shadow: 0 0 20px #ff1744;
}

.subtitle {
    margin-top: 12px;
    color: #aaa;
    font-size: clamp(14px, 3vw, 19px);
}

/* BUTTON */
.buttons {
    width: 100%;
    max-width: 500px;
    margin-top: 40px;
    display: grid;
    gap: 15px;
}

.btn {
    position: relative;
    width: 100%;
    padding: 18px;
    border: 1px solid #ff1744;
    border-radius: 12px;
    background: #111111cc;
    color: white;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: .3s;
    overflow: hidden;
}

.btn:hover {
    transform: translateY(-5px) scale(1.02);
    background: #ff1744;
    box-shadow:
        0 0 15px #ff1744,
        0 0 35px #ff174466;
}

.btn:active {
    transform: scale(.97);
}

/* STATUS */
.status {
    margin-top: 30px;
    padding: 10px 20px;
    border-radius: 30px;
    background: #ffffff0d;
    border: 1px solid #ffffff15;
    color: #aaa;
}

.status span {
    color: #00ff88;
}

/* MUSIC */
.music {
    position: fixed;
    right: 20px;
    bottom: 20px;
}

.music button {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 1px solid #ff1744;
    background: #111;
    color: white;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 0 15px #ff174466;
}

/* MOBILE */
@media (max-width: 600px) {

    .container {
        padding: 25px 18px;
    }

    .icon {
        width: 75px;
        height: 75px;
        font-size: 32px;
    }

    h1 {
        letter-spacing: 2px;
    }

    .btn {
        padding: 16px;
        font-size: 16px;
    }
}

img{
  width: 100px;
  border-radius: 100px;
}
</style>
</head>

<body>

<div class="container">

    <div class="icon">
      <img src="tom.jpg">
        <!--Tab to edit-->
     
    </div>

    <h1>MASIH <span>PROSES</span></h1>

    <p class="subtitle">
        Website sedang dalam tahap pengembangan.
        <br>
        Nantikan sesuatu yang lebih keren!
    </p>

    <div class="buttons">

        <a href="website1.html">
            <!--Tab to edit-->
        <button class="btn" onclick="proses(">
            website1
        </button>
</a>
        <button class="btn" onclick="proses(2)">
            project
        </button>

        <button class="btn" onclick="proses(3)">
            project
        </button>

        <button class="btn" onclick="proses(4)">
            project
        </button>

        <button class="btn" onclick="proses(5)">
            project
        </button>

    </div>

    <div class="status">
        STATUS : <span>● MASIH PROSES</span>
    </div>

</div>


<!-- MUSIK -->
<audio id="musik" autoplay loop>
    <source src="musik.mp3" type="audio/mpeg">
</audio>

<div class="music">
    <button onclick="toggleMusic()" id="musicBtn">
        🔊
    </button>
</div>


<script>

const musik = document.getElementById("musik");
const musicBtn = document.getElementById("musicBtn");

/* Coba autoplay */
window.addEventListener("load", () => {
    musik.play().catch(() => {
        console.log("Autoplay diblokir browser.");
    });
});

/* Tombol */
function proses(nomor) {

    // Membantu memulai musik setelah interaksi pengguna
    musik.play().catch(() => {});

    alert(
        "PROJECT " + nomor +
        "\\n\\nMasih dalam proses 🚀"
    );
}

/* Kontrol musik */
function toggleMusic() {

    if (musik.paused) {
        musik.play();
        musicBtn.innerHTML = "🔊";
    } else {
        musik.pause();
        musicBtn.innerHTML = "🔇";
    }
}

</script>

</body>
</html>
